<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    .ar-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      min-width: 160px;
      max-width: 95vw;
      font-size: 1.1rem;
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(30,60,114,0.12);
      padding: 12px 24px;
       display: none; 
    }
    #btn-detener {
      background: #1e3c72;
      color: #fff;
      border: none;
    }
    #btn-reanudar {
      background: #2a5298;
      color: #fff;
      border: none;
    }
    #btn-detener:hover, #btn-reanudar:hover {
      background: #16335c;
      color: #fff;
    }
    @media (max-width: 600px) {
      .ar-btn {
        width: 80vw;
        font-size: 1rem;
        padding: 12px 0;
        bottom: 18px;
      }
      #btn-reanudar {
        margin-top: 60px;
      }
      #btn-detener {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-container"></a-entity>
  </a-scene>

  <!-- Botones Bootstrap responsivos y personalizados -->
  <button id="btn-detener" class="btn ar-btn" style="bottom: 90px;">Stop Animation</button>
  <button id="btn-reanudar" class="btn ar-btn" style="bottom: 30px;">Start Animation</button>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
