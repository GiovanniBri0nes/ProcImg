<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Experience</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>
    /* ------------------------------------------------ */
    /* ESTILOS DE DISEÑO COPIADOS DE INDEX.HTML */
    /* ------------------------------------------------ */
    body {
        background: #1e3c72;
        color: #fff;
    }
    .logo {
        color: #FFD700 !important;
    }

    /* ------------------------------------------------ */
    /* ESTILOS DE AR Y NAVEGACIÓN */
    /* ------------------------------------------------ */

    /* Garantiza que la escena AR se ajuste al área visible y permite el scroll */
    a-scene { 
        width: 100vw; 
        height: 100vh;
        /* Asegura que la escena inicie debajo del menú fijo */
        padding-top: 56px; /* Altura aproximada de la navbar de Bootstrap */
    }

    /* Ajuste para que la escena ocupe el espacio sin el menú superior */
    /* El video y canvas deben estar fijos para la RA, pero el padding-top compensa */
    a-scene video, a-scene canvas {
        position: fixed;
        top: 0;
        left: 0;
    }
    
    /* Mueve la escena hacia abajo para evitar que el menú la tape */
    a-scene .a-canvas {
        margin-top: 56px; /* Altura de la navbar */
        height: calc(100vh - 56px) !important; /* Ajusta la altura de la escena */
    }

    /* Estilos del botón AR */
    .ar-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        min-width: 140px;
        max-width: 95vw;
        font-size: 1.05rem;
        border-radius: 18px;
        box-shadow: 0 2px 8px rgba(30,60,114,0.12);
        padding: 10px 18px;
        display: none;
        background: #2a5298;
        color: #fff;
        border: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
        outline: none;
        transition: none !important;
    }

    .ar-btn:hover,
    .ar-btn:focus,
    .ar-btn:active,
    .ar-btn:focus-visible {
        transform: translateX(-50%);
        background: #2a5298 !important;
        color: #fff !important;
        box-shadow: 0 2px 8px rgba(30,60,114,0.12) !important;
        outline: none !important;
    }

    .ar-btn:active { opacity: 0.98; }

    @media (max-width:600px) {
        .ar-btn { width: 80vw; padding: 12px 0; bottom: 18px; font-size: 1rem; }
    }
</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background:#1e3c72;">
        <div class="container">
            <a class="navbar-brand fw-bold logo" href="index.html">AR MUNDIAL 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="AR.html">Experiencia AR</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#video">Video</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#statistics">Estadísticas</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#trivia">Trivia</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Manual_de_usuario.pdf" target="_blank" rel="noopener">Manual de usuario</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <a-scene
        mindar-image="imageTargetSrc: targets.mind"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="targets-container"></a-entity>
    </a-scene>

    <button id="btn-reanudar" class="btn ar-btn">Iniciar animación</button>
    <button id="btn-detener" class="btn ar-btn" style="display:none; bottom:70px;">Parar animación</button>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
